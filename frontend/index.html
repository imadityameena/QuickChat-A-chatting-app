<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0a13" />
    <script>
      // Apply the saved theme before the page paints, so it never flashes the wrong colours
      (function () {
        var mode = "system";
        try { mode = localStorage.getItem("theme") || "system"; } catch (e) {}
        var dark = mode === "dark" || (mode === "system" && !matchMedia("(prefers-color-scheme: light)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
    <title>QuickChat</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
